name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GO_TEST_PARALLEL: '2'
      MODELROUTER_REQUIRE_EMBEDDER: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Fetch and verify pinned embedder
        env:
          MODELROUTER_EMBEDDER_DIR: ${{ runner.temp }}/modelrouter-embedder
        run: go run . embedder fetch
      - name: Verify
        env:
          MODELROUTER_EMBEDDER_DIR: ${{ runner.temp }}/modelrouter-embedder
        run: ./scripts/verify.sh
