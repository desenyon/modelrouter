# modelrouter gateway configuration
#
# Luna handles the majority of traffic. Terra covers mid-complexity work.
# Sol is reserved for tasks that actually need frontier intelligence.

listen: ":8787"
# api_key: "sk-your-gateway-key"   # optional; protects the gateway itself

upstream:
  base_url: "https://openrouter.ai/api/v1"
  # api_key loaded from MODELROUTER_UPSTREAM_API_KEY / OPENROUTER_API_KEY / OPENAI_API_KEY
  timeout: 120s

router:
  default_mode: balance          # cost | balance | intelligence
  luna_max_score: 0.42           # score ≤ this → Luna
  terra_max_score: 0.72          # score ≤ this → Terra; above → Sol
  show_routed: true              # emit X-Modelrouter-* response headers

models:
  luna:  "openai/gpt-5.6-luna"
  terra: "openai/gpt-5.6-terra"
  sol:   "openai/gpt-5.6-sol"
